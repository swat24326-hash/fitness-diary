<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192-maskable.png?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <script src="/manifest-boot.js"></script>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ядро" />
    <link rel="apple-touch-icon" href="/icons/icon-192-maskable.png?v=8" />
    <title>Ядро</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000000; }
      #yadro-boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #000000; pointer-events: none;
      }
      /* Тот же финал, что React OsMark (WELCOME_MARK_PX): крупный → 96px, центр viewport. */
      #yadro-boot-splash__mark {
        width: 96px; height: 96px;
        color: #2effb8;
        transform-origin: center;
        transform: scale(2.3);
        animation: yadro-boot-zoom 1150ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #yadro-boot-splash__mark svg { display: block; width: 100%; height: 100%; }
      @keyframes yadro-boot-zoom {
        0% { transform: scale(2.3); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #yadro-boot-splash__mark { animation: none; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="yadro-boot-splash" data-started-at="" aria-hidden="true">
      <div id="yadro-boot-splash__mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <g fill="none" stroke="#2effb8" stroke-width="2.7" stroke-linecap="butt">
    <circle cx="16" cy="16" r="13" pathLength="100" stroke-dasharray="36 14 36 14" transform="rotate(48 16 16)"/>
    <circle cx="16" cy="16" r="8.2" pathLength="100" stroke-dasharray="78 22" transform="rotate(-32 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="3.9" fill="#2effb8"/>
  <circle cx="22.05" cy="10.05" r="2.05" fill="#2effb8"/>
  <circle cx="7.05" cy="7.35" r="2.05" fill="#2effb8"/>
  <circle cx="16" cy="29.05" r="2.05" fill="#2effb8"/>
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('yadro-boot-splash');
        if (el) el.setAttribute('data-started-at', String(Date.now()));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
