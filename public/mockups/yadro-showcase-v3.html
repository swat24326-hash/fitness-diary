<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ядро — стартовый вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030806;
      --ink: #f6f4ef;
      --mute: #a8b2ac;
      --accent: #14d89a;
      --accent-bright: #2effb8;
      --glass: rgba(6, 18, 14, 0.78);
      --border: rgba(46, 255, 184, 0.14);
      --font: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
    }
    .stage {
      position: relative;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      background: var(--bg);
    }
    .stage__photo {
      position: absolute;
      inset: 0;
      background: var(--bg) url("./yadro-hero-cinematic-v4.jpg") 64% 38% / cover no-repeat;
    }
    .stage__photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(3, 8, 6, 0.78) 0%, rgba(3, 8, 6, 0.28) 38%, rgba(3, 8, 6, 0) 58%),
        linear-gradient(180deg, rgba(3, 8, 6, 0.4) 0%, transparent 28%, rgba(3, 8, 6, 0.55) 100%);
    }
    .top, .hero, .proof {
      position: relative;
      z-index: 2;
    }
    .top {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
      align-items: center;
      gap: 12px;
      padding: 18px clamp(28px, 5vw, 56px);
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
      flex-shrink: 0;
      justify-self: start;
    }
    .mark svg {
      width: 32px;
      height: 32px;
    }
    .mark span {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    .roles {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      justify-self: center;
      padding: 4px;
      border-radius: 14px;
      background: rgba(3, 8, 6, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
    }
    .roles a,
    .roles button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      min-width: 44px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .roles a:hover,
    .roles button:hover,
    .roles button[aria-expanded="true"] {
      color: var(--ink);
      background: rgba(46, 255, 184, 0.12);
    }
    .roles svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
    }
    .roles .sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.16);
      margin: 0 2px;
    }
    .top-spacer {
      justify-self: end;
      width: 1px;
      height: 1px;
    }
    .staff-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 6;
      width: min(320px, calc(100vw - 40px));
      padding: 20px 18px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(165%);
      -webkit-backdrop-filter: blur(20px) saturate(165%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }
    .staff-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .staff-panel h2 {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .staff-panel .hint {
      color: var(--mute);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .staff-panel label {
      display: block;
      font-size: 12px;
      color: var(--mute);
      margin-bottom: 6px;
    }
    .staff-panel .field { margin-bottom: 12px; }
    .staff-panel input {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    .staff-panel input:focus {
      border-color: rgba(46, 255, 184, 0.4);
      box-shadow: 0 0 0 3px rgba(46, 255, 184, 0.12);
    }
    .staff-panel .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .staff-panel .btn-go {
      flex: 1;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #03140f;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .staff-panel .btn-go:hover { background: var(--accent-bright); }
    .staff-panel .btn-close {
      min-height: 48px;
      min-width: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: transparent;
      color: var(--mute);
      font: inherit;
      cursor: pointer;
    }
    .hero {
      align-self: end;
      padding: 0 clamp(28px, 5vw, 56px) clamp(72px, 12vh, 110px);
      max-width: 26rem;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(28px, 3.2vw, 40px);
      font-weight: 650;
      line-height: 1.08;
      letter-spacing: -0.02em;
      max-width: 12ch;
      text-wrap: balance;
    }
    h1 em {
      font-style: normal;
      color: var(--accent-bright);
    }
    .lead {
      margin-top: 16px;
      max-width: 28ch;
      font-size: clamp(16px, 1.6vw, 18px);
      line-height: 1.4;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: -0.01em;
    }
    .lead em {
      font-style: normal;
      color: inherit;
      font-weight: 600;
    }
    .micro {
      margin-top: 14px;
      max-width: 36ch;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 500;
      color: var(--mute);
    }
    .proof {
      padding: 0 clamp(20px, 4vw, 48px) 28px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    @media (max-width: 1180px) and (min-width: 721px) {
      .stage__photo { background-position: 72% 40%; }
      h1 { font-size: clamp(26px, 3vw, 36px); }
      .hero { max-width: 24rem; }
    }

    @media (max-width: 720px) {
      .top {
        grid-template-columns: 1fr;
        justify-items: start;
        padding: 16px 16px 8px;
      }
      .roles {
        width: 100%;
        justify-content: stretch;
        justify-self: stretch;
      }
      .roles a,
      .roles button { flex: 1; }
      .roles .sep { display: none; }
      .top-spacer { display: none; }
      .hero {
        padding: 24px 16px 12px;
        max-width: none;
      }
      .staff-panel {
        position: fixed;
        top: auto;
        left: 16px;
        right: 16px;
        bottom: 16px;
        width: auto;
        max-height: min(70dvh, 440px);
        overflow: auto;
        transform: none;
      }
      .staff-panel.is-open { transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .staff-panel { transition: none; }
    }
  </style>
</head>
<body>
  <section class="stage" aria-label="Стартовый вход Ядро">
    <div class="stage__photo" aria-hidden="true"></div>

    <header class="top">
      <a class="mark" href="#">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="none" stroke="#2effb8" stroke-width="2">
            <circle cx="16" cy="16" r="13" pathLength="100" stroke-dasharray="36 14 36 14" transform="rotate(48 16 16)"/>
            <circle cx="16" cy="16" r="8.2" pathLength="100" stroke-dasharray="78 22" transform="rotate(-32 16 16)"/>
          </g>
          <circle cx="16" cy="16" r="3.5" fill="#2effb8"/>
          <circle cx="22.05" cy="10.05" r="1.8" fill="#2effb8"/>
          <circle cx="7.05" cy="7.35" r="1.8" fill="#2effb8"/>
          <circle cx="16" cy="29.05" r="1.8" fill="#2effb8"/>
        </svg>
        <span>ЯДРО</span>
      </a>

      <nav class="roles" aria-label="Кто вы">
        <button type="button" id="staffOpen" aria-expanded="false" aria-controls="staffPanel" title="Логин и пароль">
          Сотрудник
        </button>
        <span class="sep" aria-hidden="true"></span>
        <a href="/coach" title="Тренер · вход с телефона" aria-label="Тренер · вход с телефона">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          Тренер
        </a>
        <a href="/me" title="Клиент · вход с телефона" aria-label="Клиент · вход с телефона">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          Клиент
        </a>
        <div class="staff-panel" id="staffPanel" role="dialog" aria-label="Вход сотрудника" aria-hidden="true">
          <h2>Вход сотрудника</h2>
          <p class="hint">Логин и пароль. Роль откроется сама.</p>
          <form id="staffForm" action="#" method="dialog">
            <div class="field">
              <label for="staffLogin">Логин</label>
              <input id="staffLogin" name="login" type="text" autocomplete="username" />
            </div>
            <div class="field">
              <label for="staffPassword">Пароль</label>
              <input id="staffPassword" name="password" type="password" autocomplete="current-password" />
            </div>
            <div class="actions-row">
              <button type="submit" class="btn-go">Войти</button>
              <button type="button" class="btn-close" id="staffClose" aria-label="Закрыть">✕</button>
            </div>
          </form>
        </div>
      </nav>
      <div class="top-spacer" aria-hidden="true"></div>
    </header>

    <div class="hero">
      <h1>Операционная система <em>фитнес-клуба</em></h1>
      <p class="lead">Зал. Продажи. Управление.</p>
    </div>
  </section>

  <script>
    (function () {
      var openBtn = document.getElementById('staffOpen')
      var panel = document.getElementById('staffPanel')
      var closeBtn = document.getElementById('staffClose')
      var form = document.getElementById('staffForm')
      function setOpen(on) {
        panel.classList.toggle('is-open', on)
        panel.setAttribute('aria-hidden', on ? 'false' : 'true')
        openBtn.setAttribute('aria-expanded', on ? 'true' : 'false')
        if (on) {
          var input = document.getElementById('staffLogin')
          if (input) setTimeout(function () { input.focus() }, 40)
        }
      }
      openBtn.addEventListener('click', function () {
        setOpen(!panel.classList.contains('is-open'))
      })
      closeBtn.addEventListener('click', function () { setOpen(false) })
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false)
      })
      form.addEventListener('submit', function (e) {
        e.preventDefault()
        setOpen(false)
      })
    })()
  </script>
</body>
</html>
