# Фаза 1: еженедельный prod smoke (не на каждый push — экономия и реальный мониторинг).
name: QA prod weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  qa-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: QA with prod smoke
        run: npm run qa
        env:
          QA_ORIGIN: https://fitness-diary-bice.vercel.app
